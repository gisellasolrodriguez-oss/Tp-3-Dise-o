<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variedad de comidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="contenedor">
        <header class="cabecera">
            <h1 class="titulo-pantalla">Nuestra variedad de comidas</h1>
            <p class="texto-cuerpo">Disfruta las imagenes</p>
        </header>

        <section class="galeria-mosaico">

            <article class="item-galeria item-destacado">
                <img src="img.jpg" alt="Comida 1">
                <span class="chip chip-galeria">Con descuento</span>
            </article>

            <article class="item-galeria">
                <img src="imgdos.jpg" alt="Comida 2">
            </article>

            <article class="item-galeria item-ancho">
                <img src="imgtres.jpg" alt="Comida 3">
                <span class="chip chip-galeria">Con descuento</span>
            </article>
            
            <article class="item-galeria">
                <img src="imgcuatro.jpg" alt="Comida 4">
            </article>

            <article class="item-galeria item-alto">
                <img src="imgcinco.jpg" alt="Comida 5">
                <span class="chip chip-galeria">Con descuento</span>
            </article>
            
            <article class="item-galeria">
                <img src="imgseis.jpg" alt="Comida 6">
            </article>

            <article class="item-galeria">
                <img src="imgsiete.jpg" alt="Comida 7">
            </article>

            <article class="item-galeria item-ancho">
                <img src="imgocho.jpg" alt="Comida 8">
            </article>
            
            <article class="item-galeria">
                <img src="imgnueve.jpg" alt="Comida 9">
            </article>
            
        </section>
    </main>

</body>
</html>
