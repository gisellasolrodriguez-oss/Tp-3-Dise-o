<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Formulario Estilizado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="contenedor">
        <div class="card">
            <header class="card-cabecera">
                <h1 class="titulo-pantalla">Contacto</h1>
                <p class="texto-auxiliar">Completa el formulario y te responderemos a la brevedad.</p>
            </header>

            <form action="#" method="POST" class="formulario">
                <div class="grupo-input">
                    <label for="nombre" class="texto-cuerpo label-bold">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Gisella Rodríguez" required>
                </div>

                <div class="grupo-input">
                    <label for="email" class="texto-cuerpo label-bold">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="grupo-input">
                    <label for="mensaje" class="texto-cuerpo label-bold">Tu mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu consulta aquí..." required></textarea>
                </div>
                <button type="submit" class="btn-primario btn-formulario">Enviar Mensaje</button>
                
            </form>
        </div>
    </main>

</body>
</html>
